<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JMA Weather PDF Builder</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<main class="wrap">
  <h1>JMA Weather PDF Builder</h1>
  <p class="lead">指定した日時の実況・解析資料、またはその時刻を初期値とする予報資料を1つのPDFにまとめます。</p>
  <section class="card"><div class="grid">
    <label>対象日時<input id="date" type="date"></label>
    <label>時刻<select id="hour">
      <option value="00">00 UTC（09 JST）</option><option value="03">03 UTC（12 JST）</option>
      <option value="06">06 UTC（15 JST）</option><option value="09">09 UTC（18 JST）</option>
      <option value="12">12 UTC（21 JST）</option><option value="15">15 UTC（翌00 JST）</option>
      <option value="18">18 UTC（翌03 JST）</option><option value="21">21 UTC（翌06 JST）</option>
    </select></label>
    <label>モード<select id="mode"><option value="analysis">実況・解析</option><option value="forecast">予報</option></select></label>
  </div></section>
  <section class="card"><h2>資料を選択</h2><div id="chart-list"></div></section>
  <section class="card"><h2>取得予定</h2><div id="plan"></div></section>
  <div class="actions"><button id="build">PDFを作成</button></div>
  <pre id="log"></pre>
  <section class="card"><h2>アメダスについて</h2><p>V2では自動取得はまだ行いません。次段階で「観測値CSV + 観測所位置CSV」を読み込み、地図ページをPDFに追加します。</p></section>
</main>
<script src="config.js"></script><script src="charts.js"></script><script src="app.js"></script>
</body></html>
